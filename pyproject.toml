[project]
name = "synthetic-data-generator"
version = "0.1.0"
description = "Генерация синтетики (Blender) и верификация её пользы для сегментации дефектов"
authors = [{ name = "YaraRishar" }]
# tensorflow 2.19 → CPython ≤3.12; matplotlib 3.11 → ≥3.11
requires-python = ">=3.11,<3.13"
dependencies = [
    "tensorflow==2.19.0",
    "keras==3.9.2",
    "numpy==2.1.3",
    "opencv-python==4.11.0.86",
    "matplotlib==3.11.0",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "docker==7.1.0",
    "streamlit==1.58.0",
]

[tool.poetry]
# пакет defect_seg ставится editable (poetry install) -> чистые абсолютные импорты
packages = [{ include = "defect_seg" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
